<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youme means You and Me</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            padding: 24px;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-top: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .alert-msg {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background-color: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .alert-error {
            background-color: #fef2f2;
            color: #991b1b;
            border: 1px solid #fecaca;
        }

        .recent-wishes {
            margin-top: 36px;
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
        }

        .recent-wishes h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #1f2937;
        }

        .wish-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wish-card {
            background-color: #f3f4f6;
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .wish-author {
            font-weight: 600;
            color: #111827;
            font-size: 14px;
        }

        .wish-time {
            font-size: 12px;
            color: #6b7280;
        }

        .wish-text {
            font-size: 14px;
            color: #374151;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .empty-state {
            color: #6b7280;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Youme means You and Me</h1>
        <p>Hey, how are you feeling today?</p>
    </header>

    <main>
        <h2>Wishes</h2>
        <p>Hope you have a wonderful day</p>
        
        <form id="wishForm">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="userWish">Your Wish</label>
                <textarea id="userWish" placeholder="Write your heartfelt wish here..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit">Send Wish</button>
            <div id="statusAlert" class="alert-msg"></div>
        </form>

        <section class="recent-wishes">
            <h3>Recent 15 Wishes</h3>
            <ul class="wish-list" id="wishesContainer">
                <li class="empty-state">Loading wishes...</li>
            </ul>
        </section>
    </main>

    <script>
        // DÁN URL GOOGLE APPS SCRIPT WEB APP CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw5Sy84uj_pe4EHYA66hvqZgbeogRemf7r6Vrz8V5Q4OEaDIE59fNIIfVuaj-e-2zOPZA/exec';

        const form = document.getElementById('wishForm');
        const submitBtn = document.getElementById('btnSubmit');
        const statusAlert = document.getElementById('statusAlert');
        const wishesContainer = document.getElementById('wishesContainer');

        function showAlert(msg, isSuccess = true) {
            statusAlert.textContent = msg;
            statusAlert.className = 'alert-msg ' + (isSuccess ? 'alert-success' : 'alert-error');
            statusAlert.style.display = 'block';
            setTimeout(() => {
                statusAlert.style.display = 'none';
            }, 4000);
        }

        // Tải 15 lời chúc gần nhất
        async function fetchRecentWishes() {
            if (SCRIPT_URL === 'THAY_BANG_URL_GOOGLE_APPS_SCRIPT_CUA_BAN') {
                wishesContainer.innerHTML = '<li class="empty-state">Vui lòng thay thế SCRIPT_URL bằng URL Apps Script đã triển khai.</li>';
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    wishesContainer.innerHTML = '';
                    result.data.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'wish-card';
                        li.innerHTML = `
                            <div class="wish-header">
                                <span class="wish-author">${escapeHtml(item.name)}</span>
                                <span class="wish-time">${escapeHtml(item.timestamp)}</span>
                            </div>
                            <div class="wish-text">${escapeHtml(item.wish)}</div>
                        `;
                        wishesContainer.appendChild(li);
                    });
                } else {
                    wishesContainer.innerHTML = '<li class="empty-state">No wishes yet. Be the first to leave one!</li>';
                }
            } catch (error) {
                console.error("Error loading wishes:", error);
                wishesContainer.innerHTML = '<li class="empty-state">Unable to load recent wishes.</li>';
            }
        }

        // Xử lý gửi lời chúc bằng URL-Encoded (tránh triệt để lỗi CORS)
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            if (SCRIPT_URL === 'THAY_BANG_URL_GOOGLE_APPS_SCRIPT_CUA_BAN') {
                alert("Vui lòng gắn SCRIPT_URL trước khi gửi!");
                return;
            }

            const nameInput = document.getElementById('userName');
            const wishInput = document.getElementById('userWish');

            const name = nameInput.value.trim();
            const wish = wishInput.value.trim();

            if (!name || !wish) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            // Dùng URLSearchParams tương thích 100% với Google Apps Script
            const postData = new URLSearchParams();
            postData.append('name', name);
            postData.append('wish', wish);

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: postData.toString()
                });

                // Đăng thành công
                nameInput.value = '';
                wishInput.value = '';
                showAlert('Your wish has been submitted successfully!', true);

                // Chờ Google Sheet ghi nhận trong 1.2s rồi cập nhật lại danh sách bên dưới
                setTimeout(() => {
                    fetchRecentWishes();
                }, 1200);

            } catch (error) {
                console.error("Error submitting wish:", error);
                showAlert('Failed to send wish. Please try again.', false);
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Wish';
            }
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Tải danh sách khi khởi động trang
        fetchRecentWishes();
    </script>
</body>
</html>
