<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youme means You and Me</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f9fafb;
            padding: 24px;
        }

        header {
            text-align: center;
            padding: 40px 0 20px;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-group {
            margin-top: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #4b5563;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        button {
            display: inline-block;
            margin-top: 16px;
            padding: 10px 24px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            transition: background-color 0.2s ease;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        button:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .recent-wishes {
            margin-top: 36px;
            border-top: 1px solid #e5e7eb;
            padding-top: 24px;
        }

        .recent-wishes h3 {
            font-size: 18px;
            margin-bottom: 16px;
            color: #1f2937;
        }

        .wish-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .wish-card {
            background-color: #f3f4f6;
            padding: 14px 16px;
            border-radius: 8px;
            border-left: 4px solid #2563eb;
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .wish-author {
            font-weight: 600;
            color: #111827;
            font-size: 14px;
        }

        .wish-time {
            font-size: 12px;
            color: #6b7280;
        }

        .wish-text {
            font-size: 14px;
            color: #374151;
            white-space: pre-wrap;
        }

        .empty-state {
            color: #6b7280;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Youme means You and Me</h1>
        <p>Hey, how are you feeling today?</p>
    </header>

    <main>
        <h2>Today is Sep 11th 2026</h2>
        <p>Hope you have a wonderful day</p>
        
        <form id="wishForm">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="userWish">Your Wish</label>
                <textarea id="userWish" placeholder="Write your heartfelt wish here..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit">Send Wish</button>
        </form>

        <section class="recent-wishes">
            <h3>Recent 15 Wishes</h3>
            <ul class="wish-list" id="wishesContainer">
                <li class="empty-state">Loading wishes...</li>
            </ul>
        </section>
    </main>

    <script>
        // DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxcJMaXWpH36YQgAHz5h_8Mm74j5MSKLzoEwTl7AelLRX8tHu8txrGSj0KYYWJ-5Jd4Dw/exec';

        const form = document.getElementById('wishForm');
        const submitBtn = document.getElementById('btnSubmit');
        const wishesContainer = document.getElementById('wishesContainer');

        // Hàm tải danh sách 15 lời chúc gần nhất
        async function fetchRecentWishes() {
            if (SCRIPT_URL === 'THAY_BANG_URL_GOOGLE_APPS_SCRIPT_CUA_BAN') {
                wishesContainer.innerHTML = '<li class="empty-state">Vui lòng thay SCRIPT_URL bằng URL Apps Script của bạn.</li>';
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === "success" && result.data.length > 0) {
                    wishesContainer.innerHTML = '';
                    result.data.forEach(item => {
                        const li = document.createElement('li');
                        li.className = 'wish-card';
                        li.innerHTML = `
                            <div class="wish-header">
                                <span class="wish-author">${escapeHtml(item.name)}</span>
                                <span class="wish-time">${escapeHtml(item.timestamp)}</span>
                            </div>
                            <div class="wish-text">${escapeHtml(item.wish)}</div>
                        `;
                        wishesContainer.appendChild(li);
                    });
                } else {
                    wishesContainer.innerHTML = '<li class="empty-state">No wishes yet. Be the first to leave one!</li>';
                }
            } catch (error) {
                console.error("Error loading wishes:", error);
                wishesContainer.innerHTML = '<li class="empty-state">Could not load wishes at the moment.</li>';
            }
        }

        // Xử lý gửi lời chúc
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = document.getElementById('userName').value.trim();
            const wish = document.getElementById('userWish').value.trim();

            if (!name || !wish) return;

            submitBtn.disabled = true;
            submitBtn.textContent = 'Sending...';

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors', // Sử dụng no-cors để gửi mượt mà qua Apps Script
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ name, wish })
                });

                // Reset form sau khi gửi
                form.reset();
                
                // Đợi 1 giây để Google Sheet cập nhật rồi tải lại danh sách
                setTimeout(() => {
                    fetchRecentWishes();
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Send Wish';
                }, 1000);

            } catch (error) {
                console.error("Error submitting wish:", error);
                alert("Failed to send your wish. Please try again.");
                submitBtn.disabled = false;
                submitBtn.textContent = 'Send Wish';
            }
        });

        // Hàm hỗ trợ ngăn ngừa XSS khi hiển thị text người dùng nhập
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Tự động tải danh sách khi mở trang
        fetchRecentWishes();
    </script>
</body>
</html>
