  <meta charset="UTF-8" />

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Noto+Sans+KR:wght@400;500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #07090e;
      --panel-bg: rgba(13, 17, 26, 0.85);
      --border-glow: rgba(0, 240, 255, 0.4);
      --instructor-glow: #ff9900;
      
      /* Color definitions per category */
      --c-food: #00ff88;       /* Xanh lá */
      --c-loc: #00d4ff;        /* Xanh dương */
      --c-movie: #ff2a85;      /* Hồng neon */
      --c-singer: #b388ff;     /* Tím */
      --c-sns: #ffd166;        /* Vàng nhạt */
      --c-email: #06d6a0;      /* Xanh ngọc */
      --c-github: #ffffff;     /* Trắng */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(20, 30, 55, 0.4) 0%, transparent 80%),
        linear-gradient(rgba(0, 255, 200, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 200, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      font-family: 'Noto Sans KR', sans-serif;
      color: #e0e6ed;
    }

    /* Robotic HUD Header */
    header {
      position: absolute;
      top: 20px;
      left: 30px;
      z-index: 100;
      pointer-events: none;
    }

    .site-tag {
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      letter-spacing: 4px;
      color: #00f0ff;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .site-tag::before {
      content: '';
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #00f0ff;
      box-shadow: 0 0 10px #00f0ff;
      clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%);
    }

    h1.main-title {
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #ffffff;
      text-shadow: 0 0 15px rgba(0, 240, 255, 0.6), 0 0 30px rgba(0, 240, 255, 0.2);
      margin-top: 4px;
    }

    /* Controls Panel */
    .controls {
      position: absolute;
      top: 25px;
      right: 30px;
      z-index: 100;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(0, 240, 255, 0.3);
      border-radius: 8px;
      padding: 12px 18px;
      display: flex;
      gap: 16px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      opacity: 0.85;
      transition: all 0.2s ease;
    }

    .legend-item:hover {
      opacity: 1;
      transform: translateY(-1px);
    }

    .legend-item.active {
      font-weight: 700;
      text-shadow: 0 0 8px currentColor;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 6px currentColor;
    }

    /* Canvas for Lines */
    #connectionsCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      pointer-events: none;
    }

    /* Workspace */
    #nodesContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
    }

    /* Robotic Node Styling */
    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      cursor: grab;
      border-radius: 4px;
      transition: box-shadow 0.2s ease, border-color 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      box-sizing: border-box;
      white-space: nowrap;
    }

    .node:active {
      cursor: grabbing;
    }

    /* Student Node */
    .node.student {
      padding: 10px 20px;
      font-size: 15px;
      background: rgba(14, 21, 37, 0.9);
      border: 1.5px solid rgba(0, 240, 255, 0.4);
      color: #d1ecff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.15), inset 0 0 10px rgba(0, 240, 255, 0.08);
      clip-path: polygon(8px 0%, 100% 0%, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0% 100%, 0% 8px);
    }

    .node.student:hover {
      border-color: #00f0ff;
      color: #ffffff;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.6), inset 0 0 15px rgba(0, 240, 255, 0.3);
      z-index: 50 !important;
    }

    /* Instructor Node (Trung tâm, to nhất, hiển thị rõ ràng không bị che cắt) */
    .node.instructor {
      flex-direction: column;
      padding: 14px 34px 18px 34px;
      background: radial-gradient(circle, rgba(48, 26, 8, 0.95) 0%, rgba(18, 12, 8, 0.98) 100%);
      border: 2px solid var(--instructor-glow);
      border-radius: 8px;
      box-shadow: 0 0 35px rgba(255, 153, 0, 0.45), inset 0 0 20px rgba(255, 153, 0, 0.2);
      z-index: 30;
      gap: 6px;
    }

    .instructor-badge {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 2.5px;
      background: var(--instructor-glow);
      color: #0d0e12;
      padding: 2px 10px;
      border-radius: 3px;
      text-transform: uppercase;
      box-shadow: 0 0 10px rgba(255, 153, 0, 0.6);
      display: inline-block;
    }

    .instructor-name {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #fff2d6;
      text-shadow: 0 0 12px rgba(255, 153, 0, 0.7);
    }

    .node.instructor:hover {
      border-color: #ffaa22;
      box-shadow: 0 0 50px rgba(255, 153, 0, 0.8), inset 0 0 30px rgba(255, 153, 0, 0.4);
      z-index: 50 !important;
    }

    /* Futuristic Tooltip Card */
    #infoCard {
      position: absolute;
      display: none;
      z-index: 999;
      pointer-events: none;
      width: 320px;
      background: rgba(10, 14, 23, 0.96);
      backdrop-filter: blur(14px);
      border: 1.5px solid #00f0ff;
      border-radius: 6px;
      padding: 18px 20px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 240, 255, 0.25);
      font-size: 13px;
    }

    #infoCard::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: linear-gradient(90deg, #00f0ff, #ff2a85, #00ff88);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .card-name {
      font-size: 20px;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .card-role {
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      padding: 2px 6px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      border-radius: 3px;
    }

    .card-item {
      display: flex;
      margin-bottom: 9px;
      line-height: 1.4;
    }

    .card-label {
      width: 82px;
      flex-shrink: 0;
      font-weight: 700;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .card-value {
      flex: 1;
      font-weight: 500;
      word-break: break-all;
    }

    /* Category Labels */
    .lbl-food { color: var(--c-food); }
    .val-food { color: #d4ffe6; font-weight: 600; }

    .lbl-loc { color: var(--c-loc); }
    .val-loc { color: #cbf3ff; font-weight: 600; }

    .lbl-movie { color: var(--c-movie); }

    .lbl-singer { color: var(--c-singer); }

    .lbl-sns { color: var(--c-sns); }

    .lbl-email { color: var(--c-email); }

    .lbl-github { color: #a0aec0; }
    .val-github { color: #ffffff; font-family: 'Share Tech Mono', monospace; font-size: 11px; }

    /* Footer Hint */
    .footer-hint {
      position: absolute;
      bottom: 20px;
      left: 30px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: rgba(255, 255, 255, 0.4);
      pointer-events: none;
      line-height: 1.6;
    }
  </style>
</head>

    const CATEGORY_COLORS = {
      food: '#00ff88',

      singer: '#b388ff'
    };

    const activeFilters = {
      movie: true,
      location: true,
      singer: true,
      food: true
    };

    const container = document.getElementById('nodesContainer');
    const canvas = document.getElementById('connectionsCanvas');
    const ctx = canvas.getContext('2d');
    const infoCard = document.getElementById('infoCard');

    let nodeElements = {};
    let nodePositions = {};

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drawLines();
    }
    window.addEventListener('resize', resizeCanvas);

    function toggleCategory(cat, elem) {
      activeFilters[cat] = !activeFilters[cat];
      if (activeFilters[cat]) {
        elem.classList.add('active');
      } else {
        elem.classList.remove('active');
      }
      drawLines();
    }

    function initNodes() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const centerX = w / 2;
      const centerY = h / 2 + 10;

      const students = membersData.filter(m => m.role === 'student');
      const instructor = membersData.find(m => m.role === 'instructor');

      // Giảng viên ở giữa
      nodePositions[instructor.id] = { x: centerX, y: centerY };

      // Học sinh phân bố quanh 2 vòng
      const totalStudents = students.length;
      students.forEach((student, index) => {
        const isInner = index % 2 === 0;
        const radiusX = isInner ? Math.min(w, h) * 0.28 : Math.min(w, h) * 0.42;
        const radiusY = isInner ? Math.min(w, h) * 0.23 : Math.min(w, h) * 0.35;
        const angle = (index / totalStudents) * (Math.PI * 2) - Math.PI / 2;

        nodePositions[student.id] = {
          x: centerX + Math.cos(angle) * radiusX,
          y: centerY + Math.sin(angle) * radiusY
        };
      });

      // Tạo các Element
      membersData.forEach(member => {
        const div = document.createElement('div');
        div.className = `node ${member.role}`;
        div.id = `node-${member.id}`;

        if (member.role === 'instructor') {
          // Bố cục rõ ràng: thẻ badge ở trên, tên ở dưới
          div.innerHTML = `
            <span class="instructor-badge">INSTRUCTOR</span>
            <span class="instructor-name">${member.name}</span>
          `;
        } else {
          div.innerText = member.name;
        }

        const pos = nodePositions[member.id];
        div.style.left = `${pos.x}px`;
        div.style.top = `${pos.y}px`;

        enableDrag(div, member.id);

        div.addEventListener('mouseenter', (e) => showCard(member, e));
        div.addEventListener('mousemove', (e) => moveCard(e));
        div.addEventListener('mouseleave', hideCard);

        container.appendChild(div);
        nodeElements[member.id] = div;
      });

      resizeCanvas();
    }

    function enableDrag(elem, id) {
      let isDragging = false;
      let startX, startY;
      let initialNodeX, initialNodeY;

      elem.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        initialNodeX = nodePositions[id].x;
        initialNodeY = nodePositions[id].y;
        elem.style.zIndex = 1000;
        hideCard();

        function onMouseMove(e) {
          if (!isDragging) return;
          const dx = e.clientX - startX;
          const dy = e.clientY - startY;
          const newX = initialNodeX + dx;
          const newY = initialNodeY + dy;

          nodePositions[id].x = newX;
          nodePositions[id].y = newY;
          elem.style.left = `${newX}px`;
          elem.style.top = `${newY}px`;

          drawLines();
        }

        function onMouseUp() {
          isDragging = false;
          elem.style.zIndex = elem.classList.contains('instructor') ? 30 : 20;
          window.removeEventListener('mousemove', onMouseMove);
          window.removeEventListener('mouseup', onMouseUp);
        }

        window.addEventListener('mousemove', onMouseMove);
        window.addEventListener('mouseup', onMouseUp);
      });
    }

    function showCard(member, e) {
      document.getElementById('cName').innerText = member.name;
      document.getElementById('cRole').innerText = member.role === 'instructor' ? 'INSTRUCTOR (강사)' : 'STUDENT';
      document.getElementById('cRole').style.borderColor = member.role === 'instructor' ? 'var(--instructor-glow)' : 'rgba(0, 240, 255, 0.4)';
      document.getElementById('cRole').style.color = member.role === 'instructor' ? 'var(--instructor-glow)' : '#00f0ff';

      document.getElementById('cFood').innerText = member.food || '-';
      document.getElementById('cLoc').innerText = member.location || '-';
      document.getElementById('cMovie').innerText = member.movie || '-';
      document.getElementById('cSinger').innerText = member.singer || '-';
      document.getElementById('cSns').innerText = member.sns || '-';
      document.getElementById('cEmail').innerText = member.email || '-';
      document.getElementById('cGithub').innerText = member.github || '-';

      infoCard.style.display = 'block';
      moveCard(e);
    }

    function moveCard(e) {
      const offset = 18;
      let x = e.clientX + offset;
      let y = e.clientY + offset;

      if (x + 330 > window.innerWidth) {
        x = e.clientX - 330 - 10;
      }
      if (y + 300 > window.innerHeight) {
        y = e.clientY - 300 - 10;
      }

      infoCard.style.left = `${x}px`;
      infoCard.style.top = `${y}px`;
    }

    function hideCard() {
      infoCard.style.display = 'none';
    }

    function drawLines() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const categories = ['movie', 'location', 'singer', 'food'];

      categories.forEach(cat => {
        if (!activeFilters[cat]) return;

        const color = CATEGORY_COLORS[cat];
        const groups = {};

        membersData.forEach(m => {
          let val = m[cat];
          if (!val || val === '-' || val.trim() === '') return;
          val = val.trim().toLowerCase();
          if (!groups[val]) groups[val] = [];
          groups[val].push(m.id);
        });

        Object.keys(groups).forEach(val => {
          const ids = groups[val];
          if (ids.length > 1) {
            for (let i = 0; i < ids.length; i++) {
              for (let j = i + 1; j < ids.length; j++) {
                const p1 = nodePositions[ids[i]];
                const p2 = nodePositions[ids[j]];
                if (p1 && p2) {
                  drawLine(p1.x, p1.y, p2.x, p2.y, color);
                }
              }
            }
          }
        });
      });
    }

    function drawLine(x1, y1, x2, y2, color) {
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);

      ctx.strokeStyle = color;
      ctx.lineWidth = 2.0;
      ctx.shadowColor = color;
      ctx.shadowBlur = 10;
      ctx.globalAlpha = 0.65;
      ctx.stroke();

      const midX = (x1 + x2) / 2;
      const midY = (y1 + y2) / 2;
      ctx.beginPath();
      ctx.arc(midX, midY, 2.5, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.shadowBlur = 8;
      ctx.shadowColor = color;
      ctx.fill();

      ctx.restore();
    }

    window.addEventListener('DOMContentLoaded', () => {
      initNodes();
    });
  </script>
</body>
