<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youme means You and Me</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #f1f5f9;
            background-color: #0a092d;
            background-image: 
                radial-gradient(at 0% 0%, rgba(66, 85, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 64, 129, 0.15) 0px, transparent 50%);
            min-height: 100vh;
            padding: 24px;
        }

        header {
            text-align: center;
            padding: 40px 0 24px;
        }

        /* Tiêu đề màu hồng Neon rực rỡ */
        header h1 {
            font-size: 2.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ff2a85 0%, #ff5e98 50%, #ff80bf 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            filter: drop-shadow(0 0 20px rgba(255, 42, 133, 0.5));
        }

        header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            background: #13143a;
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        main h2 {
            font-size: 1.35rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        main > p {
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .form-group {
            margin-top: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: #1c1d4a;
            border: 2px solid #2e3856;
            border-radius: 10px;
            font-size: 15px;
            color: #ffffff;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #00f2fe;
            background-color: #232559;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        .btn-submit {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff2a85 0%, #ff5e98 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 42, 133, 0.4);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(255, 42, 133, 0.6);
            background: linear-gradient(135deg, #ff4395 0%, #ff73a8 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .alert-msg {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #10b981;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .recent-wishes {
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 28px;
        }

        .recent-wishes-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .recent-wishes h3 {
            font-size: 19px;
            font-weight: 700;
            color: #a7f3d0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recent-wishes h3::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .wish-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .wish-card {
            background-color: #1a1b4b;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid #10b981;
            animation: fadeIn 0.3s ease-in-out;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .wish-card:hover {
            transform: translateX(4px);
            border-left-color: #00f2fe;
            background-color: #1e1f54;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .wish-author {
            font-weight: 700;
            color: #38bdf8;
            font-size: 14px;
        }

        .wish-time {
            font-size: 12px;
            color: #94a3b8;
        }

        .wish-text {
            font-size: 14.5px;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .empty-state {
            color: #94a3b8;
            font-size: 14px;
            font-style: italic;
        }

        /* Phân trang với nút mũi tên trái phải */
        .pagination-container {
            margin-top: 24px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 16px;
        }

        .nav-btn {
            background-color: #1c1d4a;
            border: 1px solid #2e3856;
            color: #00f2fe;
            width: 42px;
            height: 42px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background-color: #00f2fe;
            color: #0a092d;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.4);
            transform: scale(1.05);
        }

        .nav-btn:disabled {
            color: #475569;
            border-color: #24264d;
            background-color: #141538;
            cursor: not-allowed;
            opacity: 0.5;
        }

        .page-info {
            font-size: 14px;
            font-weight: 600;
            color: #94a3b8;
            min-width: 100px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>Youme means You and Me</h1>
        <p>Hey, how are you feeling today?</p>
    </header>

    <main>
        <h2>Wishes</h2>
        <p>Hope you have a wonderful day</p>
        
        <form id="wishForm">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="userWish">Your Wish</label>
                <textarea id="userWish" placeholder="Write your heartfelt wish here..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit" class="btn-submit">Send Wish ✨</button>
            <div id="statusAlert" class="alert-msg"></div>
        </form>

        <section class="recent-wishes">
            <div class="recent-wishes-header">
                <h3>Wishes</h3>
            </div>
            
            <ul class="wish-list" id="wishesContainer">
                <li class="empty-state">Loading wishes...</li>
            </ul>

            <!-- Bộ điều khiển chuyển trang -->
            <div class="pagination-container" id="pagination">
                <button type="button" class="nav-btn" id="prevBtn" title="Previous Page">←</button>
                <span class="page-info" id="pageInfo">Page 1 of 1</span>
                <button type="button" class="nav-btn" id="nextBtn" title="Next Page">→</button>
            </div>
        </section>
    </main>

    <script>
        // Link Apps Script của bạn
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyJhS17FZ8OhH9oVQM-hLA-xmTjC-InIfNucGhCosOdpwz8pODMTsNKwDRkImIoBkGpQA/exec';

        const form = document.getElementById('wishForm');
        const submitBtn = document.getElementById('btnSubmit');
        const statusAlert = document.getElementById('statusAlert');
        const wishesContainer = document.getElementById('wishesContainer');
        const pagination = document.getElementById('pagination');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const pageInfo = document.getElementById('pageInfo');

        const ITEMS_PER_PAGE = 15;
        let allWishes = [];
        let currentPage = 1;

        function showAlert(msg, isSuccess = true) {
            statusAlert.textContent = msg;
            statusAlert.className = 'alert-msg ' + (isSuccess ? 'alert-success' : 'alert-error');
            statusAlert.style.display = 'block';
            setTimeout(() => {
                statusAlert.style.display = 'none';
            }, 3000);
        }

        function createWishElement(name, timestamp, wish) {
            const li = document.createElement('li');
            li.className = 'wish-card';
            li.innerHTML = `
                <div class="wish-header">
                    <span class="wish-author">${escapeHtml(name)}</span>
                    <span class="wish-time">${escapeHtml(timestamp)}</span>
                </div>
                <div class="wish-text">${escapeHtml(wish)}</div>
            `;
            return li;
        }

        // Render các lời chúc theo từng trang
        function renderPage(page) {
            currentPage = page;
            const totalPages = Math.ceil(allWishes.length / ITEMS_PER_PAGE) || 1;

            if (allWishes.length === 0) {
                wishesContainer.innerHTML = '<li class="empty-state">No wishes yet. Be the first to leave one!</li>';
                pagination.style.display = 'none';
                return;
            }

            const startIndex = (page - 1) * ITEMS_PER_PAGE;
            const endIndex = startIndex + ITEMS_PER_PAGE;
            const currentWishes = allWishes.slice(startIndex, endIndex);

            wishesContainer.innerHTML = '';
            currentWishes.forEach(item => {
                wishesContainer.appendChild(createWishElement(item.name, item.timestamp, item.wish));
            });

            // Hiển thị thanh điều hướng nếu có nhiều hơn 15 lời chúc
            if (totalPages > 1) {
                pagination.style.display = 'flex';
                pageInfo.textContent = `Page ${currentPage} of ${totalPages}`;
                prevBtn.disabled = (currentPage === 1);
                nextBtn.disabled = (currentPage === totalPages);
            } else {
                pagination.style.display = 'none';
            }
        }

        // Tải danh sách lời chúc từ server
        async function fetchRecentWishes() {
            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === "success" && Array.isArray(result.data)) {
                    allWishes = result.data;
                    renderPage(1);
                } else {
                    wishesContainer.innerHTML = '<li class="empty-state">No wishes yet. Be the first to leave one!</li>';
                }
            } catch (error) {
                console.error("Error loading wishes:", error);
                wishesContainer.innerHTML = '<li class="empty-state">Unable to load wishes at the moment.</li>';
            }
        }

        // Sự kiện nút chuyển trang
        prevBtn.addEventListener('click', () => {
            if (currentPage > 1) {
                renderPage(currentPage - 1);
            }
        });

        nextBtn.addEventListener('click', () => {
            const totalPages = Math.ceil(allWishes.length / ITEMS_PER_PAGE);
            if (currentPage < totalPages) {
                renderPage(currentPage + 1);
            }
        });

        // Xử lý gửi lời chúc mới
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const nameInput = document.getElementById('userName');
            const wishInput = document.getElementById('userWish');

            const name = nameInput.value.trim();
            const wish = wishInput.value.trim();

            if (!name || !wish) return;

            // 1. Cập nhật tức thì vào danh sách cục bộ và render lại trang đầu
            allWishes.unshift({
                name: name,
                timestamp: 'Just now',
                wish: wish
            });
            renderPage(1);

            // Reset ô nhập và báo thành công
            nameInput.value = '';
            wishInput.value = '';
            showAlert('Your wish has been posted! ✨', true);

            // 2. Gửi dữ liệu ngầm lên Google Sheets
            const postData = new URLSearchParams();
            postData.append('name', name);
            postData.append('wish', wish);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: postData.toString()
            }).catch(err => {
                console.error("Background sync failed:", err);
            });
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Khởi động tải dữ liệu
        fetchRecentWishes();
    </script>
</body>
</html>
