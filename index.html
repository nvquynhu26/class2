<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youme means You and Me</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            line-height: 1.6;
            color: #f1f5f9;
            background-color: #0a092d;
            background-image: 
                radial-gradient(at 0% 0%, rgba(66, 85, 255, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 64, 129, 0.12) 0px, transparent 50%);
            min-height: 100vh;
            padding: 24px;
        }

        header {
            text-align: center;
            padding: 40px 0 24px;
        }

        header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #ff4081 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(79, 172, 254, 0.3);
        }

        header p {
            color: #94a3b8;
            font-size: 1.05rem;
        }

        main {
            max-width: 720px;
            margin: 0 auto;
            background: #13143a;
            padding: 36px;
            border-radius: 20px;
            box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.08);
        }

        main h2 {
            font-size: 1.35rem;
            color: #f8fafc;
            margin-bottom: 4px;
        }

        main > p {
            color: #38bdf8;
            font-weight: 500;
            margin-bottom: 24px;
        }

        .form-group {
            margin-top: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: #38bdf8;
        }

        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px 14px;
            background-color: #1c1d4a;
            border: 2px solid #2e3856;
            border-radius: 10px;
            font-size: 15px;
            color: #ffffff;
            font-family: inherit;
            outline: none;
            transition: all 0.25s ease;
        }

        input[type="text"]::placeholder,
        textarea::placeholder {
            color: #64748b;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #00f2fe;
            background-color: #232559;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.25);
        }

        textarea {
            resize: vertical;
            min-height: 95px;
        }

        button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 28px;
            background: linear-gradient(135deg, #ff4081 0%, #f43f5e 100%);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            box-shadow: 0 4px 15px rgba(255, 64, 129, 0.4);
            transition: all 0.25s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 64, 129, 0.6);
            background: linear-gradient(135deg, #ff5292 0%, #fb7185 100%);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #475569;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        .alert-msg {
            margin-top: 14px;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }

        .alert-success {
            background-color: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid #10b981;
        }

        .alert-error {
            background-color: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .recent-wishes {
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 28px;
        }

        .recent-wishes h3 {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #a7f3d0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .recent-wishes h3::before {
            content: "";
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 10px #10b981;
        }

        .wish-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .wish-card {
            background-color: #1a1b4b;
            padding: 16px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-left: 4px solid #10b981;
            animation: fadeIn 0.3s ease-in-out;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .wish-card:hover {
            transform: translateX(4px);
            border-left-color: #00f2fe;
            background-color: #1e1f54;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .wish-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .wish-author {
            font-weight: 700;
            color: #38bdf8;
            font-size: 14px;
        }

        .wish-time {
            font-size: 12px;
            color: #94a3b8;
        }

        .wish-text {
            font-size: 14.5px;
            color: #e2e8f0;
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.5;
        }

        .empty-state {
            color: #94a3b8;
            font-size: 14px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <header>
        <h1>Youme means You and Me</h1>
        <p>Hey, how are you feeling today?</p>
    </header>

    <main>
        <h2>Today is Sep 11th 2026</h2>
        <p>Hope you have a wonderful day</p>
        
        <form id="wishForm">
            <div class="form-group">
                <label for="userName">Your Name</label>
                <input type="text" id="userName" placeholder="Enter your name" required>
            </div>

            <div class="form-group">
                <label for="userWish">Your Wish</label>
                <textarea id="userWish" placeholder="Write your heartfelt wish here..." required></textarea>
            </div>

            <button type="submit" id="btnSubmit">Send Wish ✨</button>
            <div id="statusAlert" class="alert-msg"></div>
        </form>

        <section class="recent-wishes">
            <h3>Recent 15 Wishes</h3>
            <ul class="wish-list" id="wishesContainer">
                <li class="empty-state">Loading wishes...</li>
            </ul>
        </section>
    </main>

    <script>
        // DÁN URL GOOGLE APPS SCRIPT CỦA BẠN VÀO ĐÂY
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbza95F6Z8aVWuwygF-ecQwb8g4PCAFKzkP0gXznPmAIPX44v4SxoscvEy9XsWJaLJ9wqg/exec';

        const form = document.getElementById('wishForm');
        const submitBtn = document.getElementById('btnSubmit');
        const statusAlert = document.getElementById('statusAlert');
        const wishesContainer = document.getElementById('wishesContainer');

        function showAlert(msg, isSuccess = true) {
            statusAlert.textContent = msg;
            statusAlert.className = 'alert-msg ' + (isSuccess ? 'alert-success' : 'alert-error');
            statusAlert.style.display = 'block';
            setTimeout(() => {
                statusAlert.style.display = 'none';
            }, 3000);
        }

        function createWishElement(name, timestamp, wish) {
            const li = document.createElement('li');
            li.className = 'wish-card';
            li.innerHTML = `
                <div class="wish-header">
                    <span class="wish-author">${escapeHtml(name)}</span>
                    <span class="wish-time">${escapeHtml(timestamp)}</span>
                </div>
                <div class="wish-text">${escapeHtml(wish)}</div>
            `;
            return li;
        }

        // Tải 15 lời chúc gần nhất khi khởi động trang
        async function fetchRecentWishes() {
            if (SCRIPT_URL === 'THAY_BANG_URL_GOOGLE_APPS_SCRIPT_CUA_BAN') {
                wishesContainer.innerHTML = '<li class="empty-state">Vui lòng thay thế SCRIPT_URL bằng URL Apps Script.</li>';
                return;
            }

            try {
                const response = await fetch(SCRIPT_URL);
                const result = await response.json();

                if (result.status === "success" && result.data && result.data.length > 0) {
                    wishesContainer.innerHTML = '';
                    result.data.forEach(item => {
                        wishesContainer.appendChild(createWishElement(item.name, item.timestamp, item.wish));
                    });
                } else {
                    wishesContainer.innerHTML = '<li class="empty-state">No wishes yet. Be the first to leave one!</li>';
                }
            } catch (error) {
                console.error("Error loading wishes:", error);
                wishesContainer.innerHTML = '<li class="empty-state">Unable to load recent wishes.</li>';
            }
        }

        // Gửi lời chúc và cập nhật tức thì (Optimistic UI)
        form.addEventListener('submit', (e) => {
            e.preventDefault();

            if (SCRIPT_URL === 'THAY_BANG_URL_GOOGLE_APPS_SCRIPT_CUA_BAN') {
                alert("Vui lòng gắn SCRIPT_URL trước khi gửi!");
                return;
            }

            const nameInput = document.getElementById('userName');
            const wishInput = document.getElementById('userWish');

            const name = nameInput.value.trim();
            const wish = wishInput.value.trim();

            if (!name || !wish) return;

            // Xóa thông báo trống nếu có
            const emptyEl = wishesContainer.querySelector('.empty-state');
            if (emptyEl) {
                wishesContainer.innerHTML = '';
            }

            // 1. Chèn tức thì thẻ mới lên đầu danh sách
            const newCard = createWishElement(name, 'Just now', wish);
            wishesContainer.insertBefore(newCard, wishesContainer.firstChild);

            // Giữ lại tối đa 15 thẻ trên màn hình
            while (wishesContainer.children.length > 15) {
                wishesContainer.removeChild(wishesContainer.lastChild);
            }

            // Reset form và thông báo
            nameInput.value = '';
            wishInput.value = '';
            showAlert('Your wish has been posted! ✨', true);

            // 2. Gửi ngầm tới Google Sheets
            const postData = new URLSearchParams();
            postData.append('name', name);
            postData.append('wish', wish);

            fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: postData.toString()
            }).catch(err => {
                console.error("Background sync failed:", err);
            });
        });

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        fetchRecentWishes();
    </script>
</body>
</html>
